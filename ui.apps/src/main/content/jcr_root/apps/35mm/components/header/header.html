<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.css @ categories='35mm.components.header'}"/>
<sly data-sly-call="${clientlib.js @ categories='35mm.components.header'}"/>
<div class="header">
        <div class="logo-header">
            <sly data-sly-resource="${'logo' @ resourceType='core/wcm/components/image/v3/image'}"></sly>
        </div>
        <div class="navigation-header">
            <sly data-sly-resource="${'navigation' @ resourceType='35mm/components/navigation'}">
            </sly>
        </div>
    <div class="usuario-header" data-sesion-url="${resource.path}.sesion.json">
        <div class="usuario-anonimo" hidden>
            <a class="usuario-enlace usuario-enlace-login" href="/content/35mm/us/en/login.html">Entrar</a>
            <a class="usuario-enlace usuario-enlace-destacado" href="/content/35mm/us/en/registro.html">Crear cuenta</a>
        </div>
        <div class="usuario-conectado" hidden>
            <span class="usuario-saludo">Hola, <strong class="usuario-nombre"></strong> </span>
            <a class="usuario-enlace" href="/system/sling/logout?resource=/content/35mm/us/en/example.html">Salir</a>
        </div>
    </div>
</div>
