<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
    data-sly-call="${clientlib.css @ categories='35mm.components.registro'}" />
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.js @ categories='35mm.components.registro'}" />
<div class="component-registro" data-current-resource="${resource.path}">
    <form class="registro-formulario" id="registro-formulario">
        <h2 class="registro-title">Crear cuenta</h2>
        <label class="registro-label" for="registro-usuario">Usuario</label>
        <input class="registro-input" type="text" id="registro-usuario" name="usuario" autocomplete="username" required minlength="3" maxlength="20"
               pattern="[A-Za-z0-9_]{3,20}" title="Entre 3 y 20 caracteres, letras, numeros o _">

        <label class="registro-label" for="registro-password">Contraseña</label>
        <input class="registro-input" type="password" id="registro-password" name="password" autocomplete="new-password"
                required minlength="8" maxlength="20">

        <label class="registro-label" for="registro-password">Repite la Contraseña</label>
        <input class="registro-input" type="password" id="registro-password2" name="password2" autocomplete="new-password"
               required minlength="8" maxlength="20">

        <button class="registro-input" type="submit" id="registro-boton">Crear cuenta</button>
        <p class="registro-mensaje" id="registro-mensaje" role="status"></p>

        <p class="registro-pie">¿Ya tienes cuenta?
        <a href="/content/35mm/us/en/login.html">Inicia sesión</a>
        </p>
    </form>
</div>
