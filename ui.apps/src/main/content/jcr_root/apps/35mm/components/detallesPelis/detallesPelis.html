<sly data-sly-use.model="com.mm35.core.models.DetallesPelisModel"/>
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.css @ categories='35mm.components.detallesPelis'}"/>

<!--/* Tarjeta de perfil para una Persona (director o actor): mismo marcado para los dos */-->
<template data-sly-template.tarjetaPersona="${@ persona}">
    <li class="detalle-persona">
        <img class="detalle-persona-foto"
             data-sly-test="${persona.foto}"
             src="${persona.foto}"
             alt="${persona.nombre}"
             loading="lazy"/>
        <!--/* Sin foto: circulo gris con una silueta */-->
        <span class="detalle-persona-foto detalle-persona-sin-foto" data-sly-test="${!persona.foto}" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-9 2.2-9 5v3h18v-3c0-2.8-4.6-5-9-5z"/>
            </svg>
        </span>
        <span class="detalle-persona-nombre">${persona.nombre}</span>
        <span class="detalle-persona-papel" data-sly-test="${persona.papel}">${persona.papel}</span>
    </li>
</template>

<div class="component-detallesPelis">

    <!--/* Volver a la pagina anterior (inicio o busqueda); si se entro directo por URL, va a la home */-->
    <a class="detalle-volver" href="/content/35mm/us/en.html"
       onclick="if (window.history.length > 1) { window.history.back(); return false; }">
        <span aria-hidden="true">&larr;</span> Volver
    </a>

    <!--/* Ficha: solo si el servicio ha devuelto una pelicula. "peli" es un atajo para no repetir model.pelicula */-->
    <section class="detalle" data-sly-test="${model.encontrada}" data-sly-set.peli="${model.pelicula}">

        <!--/* Fondo panoramico: decorativo, se difumina hacia abajo con CSS */-->
        <div class="detalle-fondo" data-sly-test="${peli.fondo}" aria-hidden="true">
            <img class="detalle-fondo-img" src="${peli.fondo}" alt=""/>
        </div>

        <div class="detalle-principal">
            <!--/* Columna 1: poster */-->
            <div class="detalle-poster-columna">
                <img class="detalle-poster"
                     data-sly-test="${peli.poster}"
                     src="${peli.poster}"
                     alt="${peli.titulo}"/>
            </div>

            <!--/* Columna 2: informacion, un bloque por fila */-->
            <div class="detalle-info">
                <h1 class="detalle-titulo">${peli.titulo}</h1>
                <p class="detalle-lema" data-sly-test="${peli.lema}">${peli.lema}</p>

                <!--/* Año · duracion · puntuacion: los separadores los pone el CSS */-->
                <p class="detalle-meta">
                    <span class="detalle-anio" data-sly-test="${peli.anio}">${peli.anio}</span>
                    <span class="detalle-duracion" data-sly-test="${peli.duracion}">${peli.duracion}</span>
                    <span class="detalle-puntuacion" data-sly-test="${peli.puntuacion}">
                        <span class="detalle-estrella" aria-hidden="true">&#9733;</span>
                        <strong class="detalle-nota">${peli.puntuacion}</strong><span class="detalle-sobre">/10</span>
                        <span class="detalle-votos" data-sly-test="${peli.votos}">(${peli.votos} votos)</span>
                    </span>
                </p>

                <!--/* Generos como pastillas */-->
                <ul class="detalle-generos" data-sly-test="${peli.generos}" data-sly-list.genero="${peli.generos}">
                    <li class="detalle-genero">${genero}</li>
                </ul>

                <div class="detalle-bloque" data-sly-test="${peli.sinopsis}">
                    <h2 class="detalle-subtitulo">Sinopsis</h2>
                    <p class="detalle-sinopsis">${peli.sinopsis}</p>
                </div>

                <!--/* Creditos: director y reparto con la misma tarjeta de perfil */-->
                <div class="detalle-bloque" data-sly-test="${peli.director}">
                    <h2 class="detalle-subtitulo">Dirección</h2>
                    <ul class="detalle-personas">
                        <sly data-sly-call="${tarjetaPersona @ persona=peli.director}"/>
                    </ul>
                </div>

                <div class="detalle-bloque" data-sly-test="${peli.reparto}">
                    <h2 class="detalle-subtitulo">Reparto principal</h2>
                    <ul class="detalle-personas" data-sly-list.actor="${peli.reparto}">
                        <sly data-sly-call="${tarjetaPersona @ persona=actor}"/>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!--/* Error: sin id, id no valido o pelicula inexistente */-->
    <div class="detalle-error" data-sly-test="${!model.encontrada}">
        <h1 class="detalle-error-titulo">Película no encontrada</h1>
        <p class="detalle-error-texto">No hemos podido cargar la información de esta película.</p>
        <a class="detalle-error-boton" href="/content/35mm/us/en.html">Explorar películas</a>
    </div>
</div>
<!--/* JS al final: cuando se ejecuta, el HTML de arriba ya existe */-->
<sly data-sly-call="${clientlib.js @ categories='35mm.components.detallesPelis'}"/>
